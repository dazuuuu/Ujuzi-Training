<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#006b3f" />
  <title>You're offline | Ujuzi Training</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f7f2; color: #111; display: flex; min-height: 100vh; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .card { max-width: 380px; background: #fff; border: 1px solid #c5d4cb; border-radius: 12px; overflow: hidden; }
    .bar { background: #111; border-bottom: 6px solid #bb0000; color: #fff; font-weight: bold; letter-spacing: 2px; font-size: 14px; padding: 18px; }
    .body { padding: 28px 24px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 13px; color: #2f3f37; line-height: 1.5; margin: 0 0 20px; }
    button { background: #006b3f; color: #fff; border: 0; border-radius: 8px; padding: 12px 18px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="bar">UJUZI TRAINING</div>
    <div class="body">
      <h1>You're offline</h1>
      <p>Check your internet connection, then try again. Your progress is saved on the server.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </div>
</body>
</html>
